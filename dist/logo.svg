<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Comfortaa:wght@700&amp;display=swap');
      .avi-text {
        font-family: 'Comfortaa', cursive, sans-serif;
        font-weight: 700;
        font-size: 32px;
        fill: #FF5A2A;
      }
      .d-loop {
        fill: none;
        stroke: #00A6F4;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .d-tail {
        fill: none;
        stroke: #00A6F4;
        stroke-width: 6;
        stroke-linecap: round;
      }
      .esigners-text {
        font-family: 'Caveat', cursive, sans-serif;
        font-weight: 700;
        font-size: 33px;
        fill: #000000;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Big Cyan Lowercase 'd' Stroke & Loop -->
  <!-- Top ascender of d -->
  <path d="M 52 14 Q 50 48 50 64" class="d-loop" />
  
  <!-- Outer circle loop of d encircling Avi -->
  <path d="M 50 64 C 44 86 16 88 12 66 C 8 46 26 28 50 36 C 68 42 70 70 54 82" class="d-loop" />
  
  <!-- Dynamic bottom underline flourish -->
  <path d="M 44 84 C 54 85 70 78 78 66" class="d-tail" />

  <!-- Orange 'Avi' Text angled inside loop -->
  <g transform="translate(14, 52) rotate(-35)">
    <text x="0" y="0" class="avi-text">Avi</text>
  </g>

  <!-- Black 'esigners' Handwriting Text -->
  <text x="68" y="65" class="esigners-text">esigners</text>
</svg>
